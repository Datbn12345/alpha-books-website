{% extends "base.html" %}

{% block title %}
Đổi mật khẩu thành công - Alpha Books
{% endblock %}

{% block content %}

<style>

    .reset-complete-page {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
    }

    .reset-complete-card {
        width: 100%;
        max-width: 500px;
        background: #ffffff;
        border: 1px solid #E5E5E5;
        border-radius: 16px;
        padding: 45px 40px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #FFF3ED;
        color: #F4511E;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: bold;
    }

    .reset-complete-card h1 {
        color: #222222;
        font-size: 24px;
        margin-bottom: 15px;
    }

    .reset-complete-card p {
        color: #666666;
        line-height: 1.7;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .login-button {
        display: inline-block;
        padding: 13px 28px;
        border-radius: 9px;
        background: #F4511E;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
    }

    .login-button:hover {
        background: #E64A19;
    }

</style>


<div class="reset-complete-page">

    <div class="reset-complete-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Đổi mật khẩu thành công!
        </h1>

        <p>
            Mật khẩu của bạn đã được cập nhật.
            Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
        </p>

        <a
            href="{% url 'login' %}"
            class="login-button"
        >
            ĐĂNG NHẬP
        </a>

    </div>

</div>

{% endblock %}
