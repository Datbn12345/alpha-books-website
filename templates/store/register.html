{% extends "base.html" %}

{% block title %}
Đăng ký - Alpha-books
{% endblock %}

{% block content %}

<div class="container">

    <section class="auth-page">

        <h1 class="section-title">
            Đăng ký tài khoản
        </h1>

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Mật khẩu
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Nhập lại mật khẩu
                </label>

                <input
                    type="password"
                    name="password2"
                    required
                >

            </div>

            <button type="submit">
                ĐĂNG KÝ
            </button>

        </form>

        <p>
            Đã có tài khoản?
            <a href="{% url 'login' %}">
                Đăng nhập
            </a>
        </p>

    </section>

</div>

{% endblock %}
